# Entorno LOCAL para inspeccionar la base de datos y ensayar migraciones.
# Nada de esto se usa en producción. Uso: ./db.sh help
name: lss-db

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root          # solo local
      MYSQL_DATABASE: shopdb
      MYSQL_USER: shopuser
      MYSQL_PASSWORD: shoppass
      TZ: Atlantic/Canary
    command: ["--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Interfaz web para ver tablas, columnas y datos: http://127.0.0.1:8081
  # (servidor: db, usuario: root, contraseña: root, base de datos: shopdb)
  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db

  # Arranca el backend contra esta base de datos: al arrancar, Flyway aplica las migraciones.
  # Solo con "./db.sh migrate" (perfil migrate).
  app:
    profiles: ["migrate"]
    build: ../shopsystem
    environment:
      SERVER_PORT: "56784"
      DB_URL: jdbc:mysql://db:3306/shopdb
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: solo-local-para-ensayar-migraciones-0123456789
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin
      SENDGRID_FROM_EMAIL: local@example.test
      SENDGRID_API_KEY: SG.local
      BUSINESS_NAME: Local
      BUSINESS_STREET: Local
      BUSINESS_NIF: B00000000
      VERIFACTU_PRODUCER_NAME: Local
      VERIFACTU_PRODUCER_NIF: 00000000T
    ports:
      - "127.0.0.1:56799:56784"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:

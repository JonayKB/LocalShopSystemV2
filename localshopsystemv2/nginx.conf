server {
    listen 443 ssl;
    server_name kioscobotanico.com www.kioscobotanico.com;

    # Certificados montados desde el host
    ssl_certificate /etc/letsencrypt/live/kioscobotanico.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kioscobotanico.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Ficheros con hash en el nombre (Vite): caché de un año
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html nunca en caché: así cada despliegue se ve al momento
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Nunca dos despliegues a la vez
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ tests
  backend:
    name: Backend (tests con MySQL 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Testcontainers levanta MySQL 8 en el Docker del runner: migraciones Flyway incluidas
      - name: mvn verify
        working-directory: shopsystem
        run: mvn -B -ntp verify

  frontend:
    name: Frontend (tipos, tests y build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: localshopsystemv2/package-lock.json
      - working-directory: localshopsystemv2
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

  # ------------------------------------------------------------------ imágenes
  build-and-push:
    name: Imágenes Docker
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      # Etiqueta = commit (se sabe exactamente qué hay desplegado y se puede volver atrás) + latest
      - name: Web
        run: |
          docker build ./localshopsystemv2 -t jonaykb/shop-web:${{ steps.tag.outputs.tag }} -t jonaykb/shop-web:latest
          docker push jonaykb/shop-web:${{ steps.tag.outputs.tag }}
          docker push jonaykb/shop-web:latest
      - name: API
        run: |
          docker build ./shopsystem -t jonaykb/shop-app:${{ steps.tag.outputs.tag }} -t jonaykb/shop-app:latest
          docker push jonaykb/shop-app:${{ steps.tag.outputs.tag }}
          docker push jonaykb/shop-app:latest

  # ------------------------------------------------------------------ despliegue
  deploy:
    name: Despliegue
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Desplegar en el servidor
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          port: 6454
          # Recomendado: clave SSH (secreto SSH_KEY). Mientras no exista, se usa la contraseña.
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: IMAGE_TAG
          command_timeout: 15m
          script: |
            set -euo pipefail
            # 1) Copia de la base de datos ANTES de desplegar (las migraciones se aplican al arrancar)
            mkdir -p backups
            docker exec mysql-db sh -c 'exec mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction --routines --no-tablespaces shopdb' \
              | gzip > "backups/pre-deploy-$(date +%F-%H%M%S)-${IMAGE_TAG}.sql.gz"
            find backups -name 'pre-deploy-*.sql.gz' -mtime +30 -delete
            # 2) Descargar y actualizar SIN parar antes (sin "down": la tienda no se queda caída mientras baja la imagen)
            export IMAGE_TAG
            docker compose pull
            docker compose up -d --remove-orphans
            # 3) Esperar a que la API esté sana (Flyway incluido); si no, fallar y enseñar el log
            for i in $(seq 1 36); do
              status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' shop-app || true)
              [ "$status" = "healthy" ] && echo "API sana ($IMAGE_TAG)" && break
              [ "$status" = "none" ] && echo "La imagen no tiene healthcheck: se omite la espera" && break
              sleep 5
            done
            if [ "${status:-}" != "healthy" ] && [ "${status:-}" != "none" ]; then
              docker logs --tail 150 shop-app
              echo "La API no arrancó bien. Copia de la BD en ~/backups" >&2
              exit 1
            fi
            docker image prune -f

# docker-compose de producción (el que se usa en el servidor).
# Todos los puertos escuchan solo en 127.0.0.1: delante hay un proxy inverso del host.
# Los secretos van en el fichero .env junto a este fichero (ver shopsystem/.env.example).
#
# OJO: MYSQL_ROOT_PASSWORD / DB_USERNAME / DB_PASSWORD solo se aplican la primera vez que
# MySQL inicializa el volumen db_data. Con la base ya creada, en .env deben ir los valores
# que ya tiene (los antiguos eran root / shopuser / shoppass).

services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: shopdb
      MYSQL_USER: ${DB_USERNAME:?Falta DB_USERNAME en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/mysql
      # El esquema lo crea Flyway al arrancar la app (no se monta database.sql en initdb:
      # en una instalación nueva rompería la migración).
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shopnet

  app:
    image: jonaykb/shop-app
    container_name: shop-app
    restart: always
    env_file: ".env"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:56784:56784"
    networks:
      - shopnet
    volumes:
      - ./uploads:/app/uploads
      - /etc/letsencrypt:/etc/letsencrypt:ro

  web:
    image: jonaykb/shop-web
    container_name: shop-web
    restart: always
    environment:
      HOST: kioscobotanico.com
    depends_on:
      - app
    ports:
      - "127.0.0.1:765:443"
    networks:
      - shopnet
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

networks:
  shopnet:

volumes:
  db_data:

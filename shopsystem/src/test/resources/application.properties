# Configuración de tests: MySQL 8 real en Docker (Testcontainers, ver TestDatabase), sin .env.
# Flyway crea el esquema (V1 + V2) e Hibernate VALIDA que las entidades coinciden con él.
spring.application.name=shopsystem-test
server.servlet.context-path=/kiosco

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
shop.timezone=Atlantic/Canary

sendgrid.from-email=test@example.test
sendgrid.from-name=Test
sendgrid.api-key=SG.test

jwt.secret=test-secret-de-al-menos-treinta-y-dos-caracteres
jwt.expiration=900000
jwt.refresh-expiration=2592000000
cors.allowed-origins=https://kioscobotanico.com,https://www.kioscobotanico.com
spring.security.user.name=admin
spring.security.user.password=admin

ticket-printer.ip=127.0.0.1
ticket-printer.port=1
ticket-printer.street=Calle Test 1
ticket-printer.business-name=Tienda Test
ticket-printer.nif=B12345674

shop.invoice.series=T
shop.tax.default-igic-rate=7.00

verifactu.enabled=false
verifactu.environment=test
verifactu.nif=B12345674
verifactu.business-name=Tienda Test
verifactu.software.producer-name=Test
verifactu.software.producer-nif=12345678Z
verifactu.software.name=TestPOS
verifactu.software.id=TP
verifactu.software.version=1.0
verifactu.software.installation-number=1
verifactu.certificate.path=
verifactu.certificate.password=
verifactu.sender.interval-ms=3600000
spring.task.scheduling.enabled=false
verifactu.qr.module-size=6

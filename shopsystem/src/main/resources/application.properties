spring.application.name=shopsystem

# Los valores sensibles vienen de variables de entorno o del fichero .env (ver .env.example).
# Formato ${VARIABLE} = obligatoria (la app no arranca si falta); ${VARIABLE:valor} = con valor por defecto.
# Carga opcional de .env desde el directorio de trabajo. Si no existe, se usan las variables del sistema.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:56784}
server.servlet.context-path=/kiosco

# Base de datos
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

logging.level.org.springframework=INFO
logging.level.es.ies.puerto=INFO
logging.level.es.ies.puerto.service=INFO
logging.level.es.ies.puerto.repository=INFO

# Correo (SendGrid)
sendgrid.from-email=${SENDGRID_FROM_EMAIL}
sendgrid.from-name=${SENDGRID_FROM_NAME:Stock System}
sendgrid.api-key=${SENDGRID_API_KEY}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# HTTPS directo en Spring (desactivado por defecto; actívalo con SERVER_SSL_ENABLED=true)
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.certificate=${SERVER_SSL_CERTIFICATE:}
server.ssl.certificate-private-key=${SERVER_SSL_PRIVATE_KEY:}

# Seguridad
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:360000000000}
spring.security.user.name=${ADMIN_USER}
spring.security.user.password=${ADMIN_PASSWORD}

# Impresora de tickets y datos del negocio
ticket-printer.ip=${TICKET_PRINTER_IP:127.0.0.1}
ticket-printer.port=${TICKET_PRINTER_PORT:1234}
ticket-printer.street=${BUSINESS_STREET}
ticket-printer.business-name=${BUSINESS_NAME}
ticket-printer.nif=${BUSINESS_NIF}

# Facturación
shop.invoice.series=${INVOICE_SERIES:T}
# Tipo de IGIC (%) por defecto; cada categoría puede tener el suyo (columna igic_rate)
shop.tax.default-igic-rate=${DEFAULT_IGIC_RATE:7.00}

# VERI*FACTU
verifactu.enabled=${VERIFACTU_ENABLED:false}
# test | production
verifactu.environment=${VERIFACTU_ENVIRONMENT:test}
verifactu.nif=${BUSINESS_NIF}
verifactu.business-name=${BUSINESS_NAME}
verifactu.description=${VERIFACTU_DESCRIPTION:Venta de productos}
# Lista L8B (IGIC). Confírmalo con tu gestor
verifactu.clave-regimen=${VERIFACTU_CLAVE_REGIMEN:01}

verifactu.software.producer-name=${VERIFACTU_PRODUCER_NAME}
verifactu.software.producer-nif=${VERIFACTU_PRODUCER_NIF}
# Máx. 30 caracteres
verifactu.software.name=${VERIFACTU_SOFTWARE_NAME:KioscoBotanicoPOS}
# Máx. 2 caracteres
verifactu.software.id=${VERIFACTU_SOFTWARE_ID:KB}
verifactu.software.version=${VERIFACTU_SOFTWARE_VERSION:1.0}
verifactu.software.installation-number=${VERIFACTU_INSTALLATION_NUMBER:1}

# Certificado cliente para hablar con la AEAT (.p12 fuera del repositorio)
verifactu.certificate.path=${VERIFACTU_CERT_PATH:}
verifactu.certificate.password=${VERIFACTU_CERT_PASSWORD:}
# true solo si es certificado de sello electrónico
verifactu.certificate.seal=${VERIFACTU_CERT_SEAL:false}

verifactu.sender.interval-ms=${VERIFACTU_SENDER_INTERVAL_MS:60000}
# Puntos por módulo: el QR impreso debe medir 30-40 mm
verifactu.qr.module-size=${VERIFACTU_QR_MODULE_SIZE:6}